<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案鉴 - 判例故事视频工坊</title>
<script type="importmap">
{
  "imports": {
    "@ffmpeg/ffmpeg": "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm",
    "@ffmpeg/util": "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--bg2:#12121e;--bg3:#1a1a2e;--border:#2a2a44;--text:#e0e0f0;--text2:#9090b0;--accent:#f03a47;--accent2:#ff6b6b;--gold:#ffd700;--green:#00c853;--blue:#448aff;--purple:#7c4dff;--success:#00c853;--warning:#ffd700}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
input,select,textarea{font-family:inherit}
/* ===== 登录页 ===== */
.auth-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.auth-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px}
.auth-box h1{font-size:28px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.auth-box p{text-align:center;color:var(--text2);font-size:14px;margin-bottom:30px}
.auth-tabs{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:24px}
.auth-tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:14px;color:var(--text2);background:var(--bg);transition:all .2s}
.auth-tab.active{background:var(--accent);color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:1px solid var(--border);background:var(--bg3);color:var(--text);border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s;white-space:nowrap}
.btn:hover{background:var(--border)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-success{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{background:#d32f2f;border-color:#d32f2f;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,0.05)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
/* ===== 主布局 ===== */
.app{display:none;height:100vh;overflow:hidden}
.app.show{display:flex}
.sidebar{width:280px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sidebar-header h2{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.user-info{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.nav{display:flex;flex-direction:column;padding:8px;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text2);transition:all .2s}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent);font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);min-height:56px}
.topbar h3{font-size:16px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--text2)}
.content{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}
/* ===== 仪表盘 ===== */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.card h4{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat .num{font-size:28px;font-weight:700;color:var(--accent)}
.stat .label{font-size:12px;color:var(--text2);margin-top:4px}
/* ===== 流水线 ===== */
.studio{display:flex;gap:16px;height:100%}
.studio-steps{width:200px;min-width:200px;display:flex;flex-direction:column;gap:4px}
.step-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .2s}
.step-btn:hover{background:var(--border)}
.step-btn.active{background:var(--bg3);border-color:var(--accent);color:var(--text)}
.step-btn .snum{width:24px;height:24px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text2);flex-shrink:0}
.step-btn.active .snum{background:var(--accent);color:#fff}
.step-btn.done .snum{background:var(--green);color:#fff}
.step-btn.done{color:var(--green)}
.studio-stage{flex:1;overflow-y:auto}
.stage-panel{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:24px}
.stage-panel h3{font-size:18px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
/* ===== API密钥面板 ===== */
.api-list{display:flex;flex-direction:column;gap:8px}
.api-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.api-item .name{font-weight:500;font-size:14px}
.api-item .status{font-size:12px}
.api-item .status.ok{color:var(--green)}
.api-item .status.no{color:var(--text2)}
.api-key-input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:monospace;margin-top:4px}
.api-key-input:focus{border-color:var(--accent)}
/* ===== 场景编辑器 ===== */
.scene-editor{display:flex;flex-direction:column;gap:12px}
.scene-row{display:grid;grid-template-columns:40px 1fr 80px 60px;gap:8px;align-items:center;padding:10px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.scene-row .si{color:var(--accent);font-weight:600;text-align:center}
.scene-row textarea{border:none;background:transparent;color:var(--text);font-size:13px;resize:vertical;min-height:50px;outline:none;width:100%;font-family:inherit}
.scene-row .dur input{width:100%;padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);text-align:center;font-size:13px}
.scene-row .del{cursor:pointer;color:var(--text2);font-size:18px;text-align:center}
.scene-row .del:hover{color:var(--accent)}
/* ===== 进度条 ===== */
.progress-wrap{background:var(--bg);border-radius:8px;padding:16px;margin:12px 0}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width .3s}
.progress-text{font-size:12px;color:var(--text2);margin-top:6px;text-align:center}
/* ===== 日志 ===== */
.log-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;font-size:12px;font-family:monospace;color:var(--text2);line-height:1.6}
.log-box .info{color:var(--blue)}
.log-box .ok{color:var(--green)}
.log-box .err{color:var(--accent)}
/* ===== 预览 ===== */
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.preview-item{background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.preview-item img,.preview-item canvas{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.preview-item .plabel{font-size:11px;padding:6px 8px;color:var(--text2);text-align:center}
/* ===== 滚动条 ===== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* ===== Toast ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* ===== 响应式 ===== */
@media(max-width:768px){.studio{flex-direction:column}.studio-steps{flex-direction:row;width:100%;overflow-x:auto}.step-btn{flex-shrink:0}}
.hidden{display:none!important}
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mt-12{margin-top:12px}.wrap{flex-wrap:wrap}.items-center{align-items:center}.flex-1{flex:1}
.text-center{text-align:center}.text-sm{font-size:13px;color:var(--text2)}
.text-accent{color:var(--accent)}.text-green{color:var(--green)}
.badge{display:inline-flex;padding:2px 10px;border-radius:10px;font-size:11px;background:var(--border)}
.badge-ok{background:rgba(0,200,83,0.2);color:var(--green);border:1px solid var(--green)}
.badge-no{background:rgba(144,144,176,0.2);color:var(--text2);border:1px solid var(--border)}
</style>
</head>
<body>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== 登录页 ===== -->
<div class="auth-page" id="authPage">
  <div class="auth-box">
    <h1>⚖️ 案鉴</h1>
    <p>判例故事视频工坊</p>
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="authTab('login')" id="loginTab">登录</div>
      <div class="auth-tab" onclick="authTab('register')" id="regTab">注册</div>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>用户名</label><input id="loginUser" placeholder="输入用户名"></div>
      <div class="form-group"><label>密码</label><input id="loginPass" type="password" placeholder="输入密码"></div>
      <div class="form-group"><button class="btn btn-primary" style="width:100%" onclick="login()">登录</button></div>
    </div>
    <div id="regForm" style="display:none">
      <div class="form-group"><label>设置用户名</label><input id="regUser" placeholder="至少3个字符"></div>
      <div class="form-group"><label>设置密码</label><input id="regPass" type="password" placeholder="至少6个字符"></div>
      <div class="form-group"><label>确认密码</label><input id="regPass2" type="password" placeholder="再次输入密码"></div>
      <div class="form-group"><button class="btn btn-success" style="width:100%" onclick="register()">注册</button></div>
    </div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app" id="app">
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>⚖️ 案鉴</h2>
      <span class="user-info" id="userDisplay"></span>
    </div>
    <div class="nav">
      <div class="nav-item active" onclick="navTo('dashboard')" data-nav="dashboard">📊 工作台</div>
      <div class="nav-item" onclick="navTo('apikeys')" data-nav="apikeys">🔑 API 密钥</div>
      <div class="nav-item" onclick="navTo('cases')" data-nav="cases">📚 案例库</div>
      <div class="nav-item" onclick="navTo('studio')" data-nav="studio">🎬 视频工坊</div>
      <div class="nav-item" onclick="logout()" style="margin-top:auto;color:var(--text2)">🚪 退出</div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main">
    <div class="topbar" id="topbar"><h3>工作台</h3><span class="sub">欢迎回来</span></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
// ==================== 状态管理 ====================
const DB_KEY = 'anjian_v2';

function dbGet(key, def) {
  try { const d = JSON.parse(localStorage.getItem(DB_KEY + '_' + key)); return d !== null ? d : def; } catch(e) { return def; }
}
function dbSet(key, val) { localStorage.setItem(DB_KEY + '_' + key, JSON.stringify(val)); }

// ==================== 认证系统 ====================
let currentUser = null;

function authTab(t) {
  document.getElementById('loginTab').classList.toggle('active', t === 'login');
  document.getElementById('regTab').classList.toggle('active', t === 'register');
  document.getElementById('loginForm').style.display = t === 'login' ? '' : 'none';
  document.getElementById('regForm').style.display = t === 'register' ? '' : 'none';
}

function register() {
  const user = document.getElementById('regUser').value.trim();
  const pass = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  if (!user || user.length < 3) return toast('用户名至少3个字符');
  if (!pass || pass.length < 6) return toast('密码至少6个字符');
  if (pass !== pass2) return toast('两次密码不一致');
  const users = dbGet('users', {});
  if (users[user]) return toast('用户名已存在');
  users[user] = { password: pass, created: Date.now() };
  dbSet('users', users);
  toast('✅ 注册成功，请登录');
  authTab('login');
}

function login() {
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const users = dbGet('users', {});
  if (!user) return toast('请输入用户名');
  if (!users[user]) return toast('用户不存在');
  if (users[user].password !== pass) return toast('密码错误');
  currentUser = user;
  dbSet('lastUser', user);
  enterApp();
}

function logout() {
  currentUser = null;
  document.getElementById('authPage').style.display = '';
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginPass').value = '';
}

function enterApp() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('userDisplay').innerHTML = `👤 ${currentUser}`;
  const keys = getUserKeys();
  if (Object.keys(keys).length === 0) {
    navTo('apikeys');
  } else {
    navTo('dashboard');
  }
}

function getUserKeys() { return dbGet('keys_' + currentUser, {}); }
function setUserKey(provider, key) {
  const keys = getUserKeys();
  keys[provider] = key;
  dbSet('keys_' + currentUser, keys);
}

function getUserCases() { return dbGet('cases_' + currentUser, []); }
function setUserCases(cases) { dbSet('cases_' + currentUser, cases); }

// ==================== 导航 ====================
let currentNav = 'dashboard';

function navTo(nav) {
  currentNav = nav;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.nav === nav));
  const titles = { dashboard:'工作台', apikeys:'API 密钥管理', cases:'案例库', studio:'视频工坊' };
  document.querySelector('.topbar h3').textContent = titles[nav] || nav;
  renderNav(nav);
}

function renderNav(nav) {
  const el = document.getElementById('content');
  if (nav === 'dashboard') renderDashboard(el);
  else if (nav === 'apikeys') renderApiKeys(el);
  else if (nav === 'cases') renderCases(el);
  else if (nav === 'studio') renderStudio(el);
}

// ==================== 工作台 ====================
function renderDashboard(el) {
  const cases = getUserCases();
  const keys = getUserKeys();
  const hasTTS = keys.openai || keys.volc || keys.baidu;
  const hasImg = keys.openai || keys.stability;
  el.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${cases.length}</div><div class="label">📚 案例总数</div></div>
      <div class="stat"><div class="num">${cases.filter(c=>c.status==='ready').length}</div><div class="label">✅ 已完成</div></div>
      <div class="stat"><div class="num">${Object.keys(keys).length}</div><div class="label">🔑 已配置API</div></div>
      <div class="stat"><div class="num">→</div><div class="label">🎬 今日开始制作</div></div>
    </div>
    <div class="card">
      <h4>📋 快速开始</h4>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn" onclick="navTo('cases')">📚 管理案例 →</button>
        <button class="btn ${hasTTS||hasImg?'btn-primary':''}" onclick="navTo('studio')">🎬 进入视频工坊 →</button>
        ${!hasTTS&&!hasImg?'<div class="text-sm">💡 提示：配置API密钥后可使用AI配音和AI画面生成</div>':''}
      </div>
    </div>
    <div class="card">
      <h4>⚙️ 生产流程</h4>
      <div style="font-size:13px;color:var(--text2);line-height:2">
        1. 📝 编辑故事 → 拆分场景<br>
        2. 🔊 生成配音（Web Speech / TTS API）<br>
        3. 🎨 生成画面（Canvas / AI绘图）<br>
        4. 🎬 FFmpeg合成视频 → 下载MP4
      </div>
    </div>
  `;
}

// ==================== API密钥管理 ====================
const API_PROVIDERS = [
  { id:'openai', name:'OpenAI', desc:'GPT系列 + DALL-E + TTS', fields:[{key:'apiKey',label:'API Key',type:'password'},{key:'baseUrl',label:'Base URL(可选)',type:'text',placeholder:'https://api.openai.com/v1'}] },
  { id:'volc', name:'火山引擎', desc:'语音合成TTS', fields:[{key:'appId',label:'App ID',type:'text'},{key:'accessToken',label:'Access Token',type:'password'}] },
  { id:'baidu', name:'百度AI', desc:'语音合成', fields:[{key:'appId',label:'App ID',type:'text'},{key:'apiKey',label:'API Key',type:'password'},{key:'secretKey',label:'Secret Key',type:'password'}] },
  { id:'stability', name:'Stability AI', desc:'Stable Diffusion 图片生成', fields:[{key:'apiKey',label:'API Key',type:'password'}] }
];

function renderApiKeys(el) {
  const keys = getUserKeys();
  el.innerHTML = `
    <div class="card">
      <h4>🔑 我的API密钥</h4>
      <p class="text-sm mb-16">密钥仅存储在你的浏览器本地，不会发送到任何第三方服务器</p>
      <div class="api-list">${API_PROVIDERS.map(p => {
        const k = keys[p.id] || {};
        const configured = p.fields.some(f => k[f.key]);
        return `<div class="api-item">
          <div><div class="name">${p.name}</div><div class="text-sm">${p.desc}</div></div>
          <div><span class="badge ${configured?'badge-ok':'badge-no'}">${configured?'✅ 已配置':'未配置'}</span>
          <button class="btn btn-ghost" onclick="toggleApiForm('${p.id}')">⚙️</button></div>
        </div>
        <div id="apiForm_${p.id}" class="hidden" style="padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:-4px">
          ${p.fields.map(f => `<div class="form-group"><label>${f.label}</label><input class="api-key-input" id="api_${p.id}_${f.key}" type="${f.type}" placeholder="${f.placeholder||''}" value="${k[f.key]||''}"></div>`).join('')}
          <div class="flex gap-8"><button class="btn btn-primary" onclick="saveApiKey('${p.id}')">💾 保存</button><button class="btn btn-ghost" onclick="toggleApiForm('${p.id}')">取消</button></div>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="card"><h4>💡 免费选项</h4>
      <div class="text-sm" style="line-height:1.8">
        • <strong>配音</strong>：Web Speech API（浏览器内置，完全免费）<br>
        • <strong>画面</strong>：Canvas画布渲染（前端生成，完全免费）<br>
        • <strong>合成</strong>：FFmpeg.wasm（浏览器运行，完全免费）<br>
        不配置任何API Key也能直接使用基础功能。
      </div>
    </div>`;
}

function toggleApiForm(id) {
  const el = document.getElementById('apiForm_' + id);
  el.classList.toggle('hidden');
}

function saveApiKey(id) {
  const p = API_PROVIDERS.find(x => x.id === id);
  const data = {};
  p.fields.forEach(f => { data[f.key] = document.getElementById(`api_${id}_${f.key}`).value.trim(); });
  // 只保存非空字段
  setUserKey(id, data);
  toast('✅ ' + p.name + ' 密钥已保存');
  renderApiKeys(document.getElementById('content'));
}

// ==================== 案例库 ====================
function renderCases(el) {
  let cases = getUserCases();
  el.innerHTML = `
    <div class="flex gap-8 wrap items-center mb-16">
      <button class="btn btn-primary" onclick="addCase()">+ 新案例</button>
      <button class="btn btn-ghost" onclick="exportCases()">📤 导出</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importCase').click()">📥 导入</button>
      <input type="file" id="importCase" accept=".json" style="display:none" onchange="importCases(event)">
    </div>

function importCases(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) { setUserCases(data); toast(`✅ 导入 ${data.length} 个案例`); renderCases(document.getElementById('content')); }
    } catch(err) { toast('❌ 导入失败'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function generateTTS() {
  const mode = document.querySelector('input[name="ttsMode"]:checked').value;
  const rate = parseFloat(document.getElementById('ttsRate')?.value || 1);
  const c = getCurrentCase();
  const allText = c.scenes.map((s,i) => `场景${i+1}：${s.text.replace(/\n/g, '，')}`).join('。');
  
  document.getElementById('ttsProgress').classList.remove('hidden');

  addTTSLog('🎤 开始生成配音...');

  if (mode === 'webspeech') {
    generateWebSpeechTTS(allText, rate, c);
  } else if (mode === 'openai') {
    generateOpenAITTS(allText, rate, c);
  }
}

function generateWebSpeechTTS(text, rate, c) {
  // Web Speech API 不能导出音频文件，所以我们先检测是否可用
  if (!window.speechSynthesis) {
    addTTSLog('❌ 浏览器不支持语音合成', 'err');
    return;
  }
  
  // 估计时长
  const estDuration = Math.ceil(text.length / 3.5 / rate) + 2;
  addTTSLog(`✅ Web Speech 将朗读：约${estDuration}秒`);
  addTTSLog(`⚠️ Web Speech 无法导出音频文件，但可以实时朗读`);
  addTTSLog(`💡 建议：使用「屏幕录制」功能或在下一步用OpenAI TTS导出音频文件`);

  // 试听
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = rate;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);

  // 存一个标记
  generatedAudio = { type:'webspeech', duration: estDuration, text };
  
  document.getElementById('ttsFill').style.width = '100%';
  document.getElementById('ttsText').textContent = `✅ 配音就绪（实时朗读，${estDuration}秒）`;
  addTTSLog('✅ 配音准备完成，可进入下一步', 'ok');
}

async function generateOpenAITTS(text, rate, c) {
  const keys = getUserKeys();
  const key = keys.openai;
  if (!key || !key.apiKey) {
    addTTSLog('❌ 未配置OpenAI API Key', 'err');
    return;
  }

  addTTSLog('🔄 正在请求OpenAI TTS...');
  document.getElementById('ttsFill').style.width = '30%';

  try {
    const voice = document.getElementById('openaiVoice')?.value || 'onyx';
    const baseUrl = key.baseUrl || 'https://api.openai.com/v1';
    
    const resp = await fetch(baseUrl + '/audio/speech', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + key.apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'tts-1',
        input: text,
        voice: voice,
        response_format: 'mp3',
        speed: rate
      })
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(err);
    }

    document.getElementById('ttsFill').style.width = '70%';
    addTTSLog('🔄 音频下载中...');

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    
    // 估算时长 (OpenAI TTS大约每分钟150字)
    const estDuration = Math.ceil(text.length / 2.5 / rate);
    
    if (generatedAudio && generatedAudio.url) URL.revokeObjectURL(generatedAudio.url);
    generatedAudio = { type:'openai', blob, url, duration: estDuration, text };
    
    document.getElementById('ttsFill').style.width = '100%';
    document.getElementById('ttsText').textContent = `✅ 配音已生成！${(blob.size/1024).toFixed(0)}KB，约${estDuration}秒`;
    addTTSLog(`✅ OpenAI TTS 完成！${(blob.size/1024).toFixed(0)}KB`, 'ok');
    addTTSLog(`💡 可在下一步合成视频`, 'ok');

    // 添加试听
    addTTSLog(`<button class="btn btn-ghost" style="margin-top:4px" onclick="document.getElementById('audioPreview').play()">▶ 试听配音</button>
      <audio id="audioPreview" src="${url}" style="display:none" controls></audio>`);

  } catch(e) {
    addTTSLog('❌ 错误：' + e.message, 'err');
    document.getElementById('ttsText').textContent = '❌ 生成失败';
  }
}

function previewTTS() {
  if (generatedAudio && generatedAudio.type === 'openai' && generatedAudio.url) {
    const a = new Audio(generatedAudio.url);
    a.play();
  } else if (generatedAudio && generatedAudio.type === 'webspeech') {
    const u = new SpeechSynthesisUtterance(generatedAudio.text);
    u.lang = 'zh-CN';
    u.rate = parseFloat(document.getElementById('ttsRate')?.value || 1);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } else {
    toast('请先生成配音');
  }
}

function stopTTS() {

}

const THEMES = {
  dark: { bg: ['#0a0a12','#1a1a2e','#12121e'], accent: '#f03a47', text: '#ffffff' },
  warm: { bg: ['#1a120e','#2a1a12','#3a2218'], accent: '#ff6b35', text: '#f0e0d0' },
  cool: { bg: ['#0a1628','#0f2040','#162a52'], accent: '#448aff', text: '#e0e8f8' },
  drama: { bg: ['#1a0a0a','#2e1212','#3e1a1a'], accent: '#ffd700', text: '#ffffff' },
  bright: { bg: ['#1a1a2e','#2a2a44','#3a3a56'], accent: '#00c853', text: '#f0f0f0' }
};

function generateFrames() {
  const c = getCurrentCase();
  const mode = document.querySelector('input[name="imgMode"]:checked').value;
  const theme = THEMES[document.getElementById('colorTheme').value] || THEMES.dark;
  
  document.getElementById('imgProgress').classList.remove('hidden');
  document.getElementById('framePreview').innerHTML = '';
  
  generatedFrames = [];
  let completed = 0;

  c.scenes.forEach((s, i) => {
    // 创建临时canvas
    const canvas = document.createElement('canvas');
    canvas.width = 540;
    canvas.height = 960;
    const ctx = canvas.getContext('2d');

    // 渲染
    drawFrame(ctx, 540, 960, s, theme, c, i);
    
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      generatedFrames.push({ blob, url, sceneIndex: i, text: s.text });
      
      // 预览
      const preview = document.getElementById('framePreview');
      preview.innerHTML += `<div class="preview-item">
        <img src="${url}" alt="场景${i+1}">
        <div class="plabel">场景 ${i+1}（${s.dur}秒）</div>
      </div>`;
      
      completed++;
      document.getElementById('imgFill').style.width = (completed / c.scenes.length * 100) + '%';
      document.getElementById('imgText').textContent = `生成中 ${completed}/${c.scenes.length}`;
      
      if (completed === c.scenes.length) {
        document.getElementById('imgText').textContent = '✅ 全部画面已生成！';
        toast(`✅ ${completed} 帧画面已生成`);
      }
    }, 'image/png');
  });
}

function drawFrame(ctx, w, h, scene, theme, c, idx) {
  // 背景
  const bgColor = theme.bg[idx % theme.bg.length];
  const grad = ctx.createRadialGradient(w/2, h/3, 0, w/2, h/2, w*0.6);
  grad.addColorStop(0, lighten(bgColor, 20));
  grad.addColorStop(1, bgColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 装饰圆点
  ctx.globalAlpha = 0.05;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    ctx.arc(
      w/2 + Math.sin(i * 1.8) * w * 0.35,
      h * 0.3 + Math.cos(i * 1.8) * h * 0.2,
      40 + i * 15, 0, Math.PI * 2
    );
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 边框
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(20, 20, w-40, h-40);

  // 编号和品牌
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`#${c.num} · 场景 ${idx+1}/${c.scenes.length}`, 36, 48);
  ctx.textAlign = 'right';
  ctx.fillText('⚖️ 案鉴', w-36, 48);

  // Emoji图标
  if (scene.icon) {
    ctx.textAlign = 'center';
    ctx.font = '64px "Apple Color Emoji","Segoe UI Emoji"';
    ctx.fillText(scene.icon, w/2, 200);
  }

  // 文本
  const lines = scene.text.split('\n');
  const fontSize = lines.length > 3 ? 38 : 48;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  lines.forEach((line, li) => {
    const y = 400 + (li - (lines.length-1)/2) * (fontSize + 12);
    const isHL = line.includes('✓') || line.includes('劳动关系') || line.includes('=');
    
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = isHL ? theme.accent : '#ffffff';
    ctx.font = (isHL ? 'bold ' : '') + fontSize + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(line, w/2, y);
    ctx.shadowBlur = 0;
  });

  // 底部页码圆点
  const dotCount = c.scenes.length;
  const dotGap = 16;
  const startX = w/2 - (dotCount * dotGap) / 2;
  for (let i = 0; i < dotCount; i++) {
    ctx.beginPath();
    ctx.arc(startX + i * dotGap, h-60, 5, 0, Math.PI*2);
    ctx.fillStyle = i === idx ? '#f03a47' : i < idx ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.1)';
    ctx.fill();
  }
}

function lighten(hex, amt) {
  const r = Math.min(parseInt(hex.slice(1,3),16)+amt,255);
  const g = Math.min(parseInt(hex.slice(3,5),16)+amt,255);
  const b = Math.min(parseInt(hex.slice(5,7),16)+amt,255);
  return `rgb(${r},${g},${b})`;
}

function downloadFrames() {
  if (generatedFrames.length === 0) return toast('请先生成画面');

}

function stepBack() {

function addFFmpegLog(msg, cls='info') {
  const el = document.getElementById('ffmpegLog');
  if (el) el.innerHTML += `<div class="${cls}">${msg}</div>`;
}

let finalVideoBlob = null;

async function composeVideo() {
  const mode = document.querySelector('input[name="composeMode"]')?.value || 'canvas';
  
  if (mode === 'canvas') await composeWithCanvas();
  else if (mode === 'ffmpeg') await composeWithFFmpeg();
  else if (mode === 'screencap') await composeWithScreenCap();
}

// ===== 方式1: Canvas录制（兼容性最好，GitHub Pages可用） =====
async function composeWithCanvas() {
  const el = document.getElementById('ffmpegProgress');
  const log = document.getElementById('ffmpegLog');
  el.classList.remove('hidden');
  document.getElementById('videoResult').classList.add('hidden');
  log.innerHTML = '';
  
  function l(msg, c='info') { log.innerHTML += `<div class="${c}">${msg}</div>`; }

  if (!generatedAudio || !generatedAudio.blob) { l('❌ 没有配音文件', 'err'); return; }
  if (generatedFrames.length === 0) { l('❌ 没有画面文件', 'err'); return; }

  const c = getCurrentCase();
  l('🔄 初始化Canvas录制器...');
  document.getElementById('ffmpegText').textContent = '初始化...';

  try {
    // 创建离屏Canvas
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 540; offCanvas.height = 960;
    const offCtx = offCanvas.getContext('2d');
    
    // 加载所有帧为Image对象
    const images = [];
    for (let i = 0; i < generatedFrames.length; i++) {
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = generatedFrames[i].url;
      });
      images.push(img);
      l(`📷 场景${i+1}: 图片已加载`);
    }
    
    // 设置音频上下文
    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();
    
    // 加载音频
    const audioData = await generatedAudio.blob.arrayBuffer();
    const audioBuffer = await audioCtx.decodeAudioData(audioData);
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(dest);
    
    // 同步背景音乐
    const bgm = audioCtx.createOscillator();
    const bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.015;
    bgm.type = 'sine';
    bgm.frequency.value = 180;
    bgm.connect(bgmGain);
    bgmGain.connect(dest);
    bgm.start();
    
    // 视频流
    const videoStream = offCanvas.captureStream(30);
    const combined = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ]);
    
    // 开始录制
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9' : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
      ? 'video/webm;codecs=vp8' : 'video/webm';
    
    const recorder = new MediaRecorder(combined, { mimeType });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    
    const totalDuration = audioBuffer.duration;
    l(`🎬 开始录制 (${Math.ceil(totalDuration)}秒, ${mimeType})`, 'ok');
    document.getElementById('ffmpegText').textContent = '录制中...';
    
    // 计算每个场景的时间分配
    const totalSceneDur = c.scenes.reduce((s, x) => s + x.dur, 0);
    
    recorder.start(100);
    source.start();
    
    const startTime = Date.now();
    let prevScene = -1;
    
    function renderFrame() {
      const elapsed = (Date.now() - startTime) / 1000;
      const pct = Math.min(elapsed / totalDuration * 100, 100);
      document.getElementById('ffmpegFill').style.width = pct + '%';
      document.getElementById('ffmpegText').textContent = `录制中 ${Math.floor(pct)}% (${Math.ceil(elapsed)}/${Math.ceil(totalDuration)}秒)`;
      
      // 计算当前场景
      let acc = 0;
      let curScene = c.scenes.length - 1;
      for (let i = 0; i < c.scenes.length; i++) {
        const sceneDur = (c.scenes[i].dur / totalSceneDur) * totalDuration;
        acc += sceneDur;
        if (elapsed < acc) { curScene = i; break; }
      }
      
      if (curScene !== prevScene) {
        prevScene = curScene;
        if (images[curScene]) {
          offCtx.drawImage(images[curScene], 0, 0, 540, 960);
        }
      }
      
      if (elapsed >= totalDuration + 0.5) {
        recorder.stop();
        bgm.stop();
        l('⏳ 合成完成...', 'ok');
        return;
      }
      requestAnimationFrame(renderFrame);
    }
    
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      finalVideoBlob = blob;
      
      document.getElementById('ffmpegFill').style.width = '100%';
      document.getElementById('ffmpegText').textContent = `✅ 已完成！${(blob.size/1024/1024).toFixed(1)}MB`;
      
      document.getElementById('videoResult').classList.remove('hidden');
      document.getElementById('finalVideo').src = url;
      document.getElementById('videoInfo').textContent = `${(blob.size/1024/1024).toFixed(1)}MB | WebM`;
      l(`✅ 视频已生成！${(blob.size/1024/1024).toFixed(1)}MB`, 'ok');
    };
    
    renderFrame();
    
  } catch(e) {
    l('❌ Canvas录制失败: ' + e.message, 'err');
    l('💡 尝试使用「屏幕录制」方式', 'info');
    document.getElementById('ffmpegText').textContent = '❌ 失败，试试屏幕录制';
  }
}

// ===== 方式2: FFmpeg.wasm =====
async function composeWithFFmpeg() {
  document.getElementById('ffmpegProgress').classList.remove('hidden');
  document.getElementById('videoResult').classList.add('hidden');
  document.getElementById('ffmpegLog').innerHTML = '';
  
  function l(msg, c='info') { addFFmpegLog(msg, c); }

  if (!generatedAudio || !generatedAudio.blob) { l('❌ 没有配音文件', 'err'); return; }
  if (generatedFrames.length === 0) { l('❌ 没有画面文件', 'err'); return; }

  l('🔄 正在加载FFmpeg.wasm...');
  document.getElementById('ffmpegText').textContent = '加载FFmpeg...';
  
  try {
    const { FFmpeg } = await import('@ffmpeg/ffmpeg');
    const { toBlobURL } = await import('@ffmpeg/util');
    const ffmpeg = new FFmpeg();
    
    ffmpeg.on('progress', ({ progress }) => {
      document.getElementById('ffmpegFill').style.width = Math.min(progress * 100, 99) + '%';
      document.getElementById('ffmpegText').textContent = `合成中 ${Math.floor(progress * 100)}%`;
    });
    ffmpeg.on('log', ({ message }) => { 
      if (message.includes('Error')) l('⚠️ ' + message, 'err'); 
    });

    const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
    await ffmpeg.load({
      coreURL: await toBlobURL(baseURL + '/ffmpeg-core.js', 'text/javascript'),
      wasmURL: await toBlobURL(baseURL + '/ffmpeg-core.wasm', 'application/wasm'),
    });
    l('✅ FFmpeg 加载完成', 'ok');

    // 写入音频
    const audioData = new Uint8Array(await generatedAudio.blob.arrayBuffer());
    await ffmpeg.writeFile('audio.mp3', audioData);
    l(`✅ 音频已写入 (${(audioData.length/1024).toFixed(0)}KB)`, 'ok');

    // 写入帧
    const c = getCurrentCase();
    for (let i = 0; i < generatedFrames.length; i++) {
      const imgData = new Uint8Array(await generatedFrames[i].blob.arrayBuffer());
      await ffmpeg.writeFile(`frame_${String(i).padStart(3,'0')}.png`, imgData);
    }
    l(`✅ ${generatedFrames.length} 帧已写入`, 'ok');

    // concat
    let cc = 'ffconcat version 1.0\n';
    for (let i = 0; i < generatedFrames.length; i++) {
      cc += `file frame_${String(i).padStart(3,'0')}.png\nduration ${c.scenes[i]?.dur || 5}\n`;
    }
    cc += `file frame_${String(generatedFrames.length - 1).padStart(3,'0')}.png\n`;
    await ffmpeg.writeFile('concat.txt', cc);

    l('🎬 运行FFmpeg合成...');
    await ffmpeg.exec(['-f','concat','-safe','0','-i','concat.txt','-i','audio.mp3',
      '-c:v','libx264','-pix_fmt','yuv420p','-c:a','aac','-shortest','-movflags','+faststart','output.mp4']);
    
    const data = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([data.buffer], { type: 'video/mp4' });
    finalVideoBlob = blob;
    
    document.getElementById('ffmpegFill').style.width = '100%';
    document.getElementById('ffmpegText').textContent = '✅ 合成完成！';
    document.getElementById('videoResult').classList.remove('hidden');
    document.getElementById('finalVideo').src = URL.createObjectURL(blob);
    document.getElementById('videoInfo').textContent = `${(blob.size/1024/1024).toFixed(1)}MB | MP4`;
    l(`✅ 视频已生成！${(blob.size/1024/1024).toFixed(1)}MB`, 'ok');
    ffmpeg.terminate();

  } catch(e) {
    l('❌ FFmpeg失败: ' + e.message, 'err');
    l('💡 切换到「Canvas录制」模式试试', 'info');
    document.getElementById('ffmpegText').textContent = '❌ FFmpeg不可用，请切到Canvas模式';
  }
}

// ===== 方式3: 屏幕录制（Web Speech备用） =====
async function composeWithScreenCap() {
  const log = document.getElementById("ffmpegLog");
  const el = document.getElementById("ffmpegProgress");
  el.classList.remove("hidden");
  document.getElementById("videoResult").classList.add("hidden");
  log.innerHTML = "";
  const l = (msg, c="info") => { log.innerHTML += `<div class="${c}">${msg}</div>`; };
  const c = getCurrentCase();
  if (generatedFrames.length === 0) { l("没有画面文件", "err"); return; }
  l("请求屏幕共享...");
  document.getElementById("ffmpegText").textContent = "请求屏幕共享...";
  try {
    const displayStream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: 540, height: 960 },
      audio: { echoCancellation: false, noiseSuppression: false }
    });
    const audioTracks = displayStream.getAudioTracks();
    l("已获取: 视频1 + 音频" + audioTracks.length, "ok");
    if (audioTracks.length === 0) l("未捕获到音频(需勾选分享音频)", "err");
    const images = [];
    for (let i = 0; i < generatedFrames.length; i++) {
      const img = new Image();
      await new Promise((r, rej) => { img.onload = r; img.onerror = rej; img.src = generatedFrames[i].url; });
      images.push(img);
    }
    const chunks = [];
    const recorder = new MediaRecorder(displayStream, { mimeType: "video/webm" });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    const offCanvas = document.createElement("canvas");
    offCanvas.width = 540; offCanvas.height = 960;
    const offCtx = offCanvas.getContext("2d");
    const totalDur = Math.max(c.scenes.reduce((s,x)=>s+x.dur,0), generatedAudio?.duration||0);
    recorder.start(100);
    l("开始录制...", "ok");
    document.getElementById("ffmpegText").textContent = "录制中 0%";
    const startTime = Date.now();
    let prevScene = -1;
    function renderFrame() {
      const elapsed = (Date.now() - startTime) / 1000;
      const pct = Math.min(elapsed/totalDur*100, 100);
      document.getElementById("ffmpegFill").style.width = pct + "%";
      document.getElementById("ffmpegText").textContent = "录制中 " + Math.floor(pct) + "%";
      let acc = 0;
      let curScene = c.scenes.length - 1;
      for (let i = 0; i < c.scenes.length; i++) {
        acc += c.scenes[i].dur;
        if (elapsed < acc) { curScene = i; break; }
      }
      if (curScene !== prevScene && images[curScene]) {
        prevScene = curScene;
        offCtx.drawImage(images[curScene], 0, 0, 540, 960);
        const preview = document.getElementById("vc");
        if (preview) preview.getContext("2d").drawImage(offCanvas, 0, 0);
      }
      if (elapsed >= totalDur + 0.5) { recorder.stop(); return; }
      requestAnimationFrame(renderFrame);
    }
    recorder.onstop = () => {
      displayStream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: "video/webm" });
      finalVideoBlob = blob;
      document.getElementById("ffmpegFill").style.width = "100%";
      document.getElementById("ffmpegText").textContent = "完成! " + (blob.size/1024/1024).toFixed(1) + "MB";
      document.getElementById("videoResult").classList.remove("hidden");
      document.getElementById("finalVideo").src = URL.createObjectURL(blob);
      document.getElementById("videoInfo").textContent = (blob.size/1024/1024).toFixed(1) + "MB | WebM";
      l("视频已生成!", "ok");
    };
    renderFrame();
  } catch(e) {
    l("失败: " + (e.name==="NotAllowedError"?"用户取消":e.message), "err");
    document.getElementById("ffmpegText").textContent = "录制失败";
  }
}function downloadVideo() {
  if (!finalVideoBlob) return toast('请先生成视频');
  const c = getCurrentCase();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(finalVideoBlob);
  a.download = `案鉴_${c.num}_${c.title.replace(/[/\\?%*:|"<>]/g,'')}.mp4`;
  a.click();
  toast('📥 下载中...');
}
